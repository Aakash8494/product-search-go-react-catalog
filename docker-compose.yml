version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: product-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: product-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disables HTTPS/auth for local dev ease
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Caps memory usage so your Mac doesn't choke
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: product-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  es_data:
  redis_data:
